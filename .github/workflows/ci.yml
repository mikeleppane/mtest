name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older, still-running workflow.
# Never on the default branch: `main`'s runs are the per-commit record, and
# superseding one leaves the commit it was proving with a cancelled run and no
# green evidence -- a state nothing later reconstructs, because the next push
# proves the next commit, not that one. On a branch or PR the older run is
# proving a revision nobody will merge, so cancelling it costs nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The default token only needs to read the repo.
permissions:
  contents: read

jobs:
  linux-preflight:
    name: Linux / preflight
    runs-on: ubuntu-24.04
    # Every job below carries a ceiling because GitHub's default is six hours
    # and the internal watchdogs in scripts/harness/ cannot supply one: they
    # bound the commands this repository runs, and the ways a hosted job hangs
    # happen outside any process they supervise -- a `setup-pixi` action that
    # never returns, a conda solve stalled on a channel, an `apt-get` waiting on
    # a mirror. Without a cap those hold a runner for six hours and report
    # nothing.
    #
    # Every tier below sits well above any healthy run of the jobs it covers,
    # and is never trimmed to fit one. A ceiling answers exactly one question --
    # is this job stuck? -- so it must be set where a job an order of magnitude
    # over budget is understood as wedged, while a job merely slower than it was
    # last month stays a passing run. Sizing a tier against whatever a lane
    # currently takes inverts that: it turns every ordinary slowdown into a red
    # X, and makes the ceilings themselves churn. This is the cheapest tier,
    # covering one locked Pixi install and the static barrier below.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow uses the token after the clone, and a
          # persisted credential stays in `.git/config` for every later step --
          # including the ones that run this repository's own scripts and the
          # third-party build tools they invoke. `release.yml` already drops it;
          # this makes the policy uniform across the repository's workflows.
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          # Install exactly what pixi.lock pins; fail if the lock is stale.
          locked: true
          cache: true

      - name: Mojo version
        run: pixi run mojo-version

      # The exact cheap fail-fast barrier: identity and static policy, native
      # audit, package compilation, JUnit tooling, and transcript fidelity.
      - name: Static and transcript preflight
        run: pixi run ci-preflight

  linux-test-matrix:
    name: Linux / ${{ matrix.lane }}
    needs: linux-preflight
    strategy:
      # Each lane is an independent gate over the same commit, not a sample of
      # one shared property, so a failure in one says nothing about the other
      # eight. Cancelling them discards eight verdicts that were already being
      # produced and leaves the run reporting a single fact, which turns a
      # broken commit into fix-push-discover-the-next-one one lane at a time.
      # Every lane's verdict is wanted, because the whole set is what a reviewer
      # has to act on. Matches `macos-test-matrix` below.
      fail-fast: false
      matrix:
        include:
          # A row carries only the keys it uses. An absent matrix key evaluates
          # falsy in an expression, which is what every `if:` and the
          # `timeout-minutes` fallback below read, so a row of `false`/`none`
          # sentinels would restate the default nine times while making the
          # rows that do carry a real value harder to pick out. `lane` is an
          # externally configured required-check name; do not rename one.
          #
          # `store_cache` marks the lanes whose mtest invocations root the
          # build-artifact store in the checkout, and so the only lanes an
          # `actions/cache` over that store can serve. The restore step below
          # carries the full argument, including what the four unmarked lanes
          # do instead and what the trade gives up.
          #
          # This runner is dedicated to the job for its duration, unlike a
          # shared local machine, so `pixi run test`'s `auto` default (half the
          # cores, src/mtest/session/pool_plan.mojo) is the wrong call here: a
          # standard public-repo ubuntu-24.04 runner has 4 vCPUs, so `auto`
          # would use only 2. `workers` carries an explicit override sized to
          # this runner's real core count; see DEFAULT_WORKERS in
          # scripts/harness/selfhost.py for the full reasoning and why this
          # lives here instead of in pixi.toml.
          - lane: direct tests
            task: test
            workers: "4"
            store_cache: true
          - lane: assertions
            task: assertions-check
          - lane: self-hosted tests
            task: dogfood-check
            store_cache: true
          - lane: end-to-end tests
            task: e2e
            store_cache: true
          # Drives real `build/mtest` processes against throwaway projects,
          # concurrently and under the publication fault seam, and asserts the
          # artifact store's protocol properties from outside the process. It
          # is the only coverage `--no-cache` and `--cache-clear` have, and it
          # carries no `store_cache` on purpose: it is the cold witness the
          # restore step below argues from, so it must keep proving that a
          # from-scratch store still behaves.
          - lane: cache protocol
            task: cache-protocol-check
          # Guards the production build's precompile stamp, the one thing that
          # keeps a `pixi run build` over changed sources from linking against
          # a package compiled from the previous ones. No `store_cache` either,
          # and for a sharper reason than the rest: the restore step below
          # leans on that stamp, so the gate proving it refuses a stale one
          # cannot itself be handed a restored stamp to judge.
          - lane: build stamp
            task: build-stamp-check
          - lane: strict contract
            task: contract-check-strict
          # Both memory lanes below build every binary they judge from source,
          # with `-I src -I tests/support` (and the vendored TOML parser as
          # source for the CLI probe), so no `pixi run build` precedes them:
          # they never read `build/mtest` or `build/mtest.mojopkg`, and the
          # CLI_BINARY docstrings in scripts/checks/memory/asan.py and
          # scripts/checks/memory/valgrind.py both say why -- the shipped
          # artifact is uninstrumented and carries no `-g` guarantee, so
          # reusing it would defeat the lane. `build/safety/` and
          # `build/tests/` are outputs these two create themselves.
          - lane: ASan + LSan
            task: asan-check
            safety_artifact: true
            artifact_name: asan-logs
            artifact_path: build/safety/asan/*.log
            timeout: 30
          - lane: Valgrind Memcheck
            task: valgrind-check
            libc_debug: true
            safety_artifact: true
            artifact_name: valgrind-logs
            artifact_path: build/safety/valgrind/*.log
            timeout: 30
    runs-on: ubuntu-24.04
    # The wide tier, sized for the widest lane: `direct tests` runs the whole
    # discovered corpus, so it sets the shape of a healthy run here and every
    # other lane on this matrix does strictly less. See the tier reasoning on
    # `linux-preflight` for why this is not fitted to what the lane costs today.
    #
    # The two memory lanes take a tighter ceiling from their own rows. Each runs
    # a bounded inventory enumerated in its own checker rather than whatever
    # discovery finds, so the narrower budget still clears a healthy run with
    # room to spare -- and these are the two lanes that gain the most from a
    # ceiling, because their internal guards cannot supply one: BUILD_TIMEOUT in
    # scripts/checks/memory/asan.py gives every instrumented build its own
    # deliberately generous budget and that lane runs sixteen builds under it,
    # so the per-build guards sum far past any job worth waiting for and this is
    # the only thing that stops a wedged compiler. Carried as a matrix key
    # rather than a `matrix.safety_artifact && 30 || 40` ternary so the value
    # sits on the row it applies to, beside the other per-lane facts, and so a
    # third tier costs one key instead of a rewrite.
    timeout-minutes: ${{ matrix.timeout || 40 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          cache: true

      # This is the only post-Pixi network exception among source, test, and
      # memory-analysis lanes. It is confined to the Valgrind cell on PRs,
      # main/master pushes, and manual unified-CI runs. The independent package
      # lane has its own external-channel solve contract. The exception is
      # bounded to glibc debug symbols MATCHING the libc6 this cell runs
      # against -- that is what Memcheck reads. It does not promise libc6
      # itself never moves; the step below says why, names the only two
      # packages that may be installed, and asserts the pair.
      - name: Install matching glibc debug symbols
        if: ${{ matrix.libc_debug }}
        run: |
          libc_version="$(dpkg-query -W -f='${Version}' libc6)"
          echo "preinstalled libc6 $libc_version"
          sudo apt-get update
          apt-cache policy libc6 libc6-dbg
          # Prefer the preinstalled revision so nothing else on the image moves.
          # The archive drops superseded glibc revisions, so that pin becomes
          # unsatisfiable as soon as the runner image lags a security update --
          # observed with libc6 2.39-0ubuntu8.7 preinstalled and only 8.8 left in
          # noble-updates. The property Memcheck actually needs is that the debug
          # symbols MATCH libc6, not that libc6 never changes, so the fallback
          # moves both together and the assertion below compares them to each
          # other. Upgrading libc6 without libc6-dbg, or the reverse, is the one
          # outcome that must never pass.
          if ! sudo apt-get install --yes --no-install-recommends \
              "libc6-dbg=$libc_version"; then
            echo "libc6-dbg=$libc_version unavailable; moving libc6 and libc6-dbg together"
            candidate="$(apt-cache policy libc6-dbg | awk '/Candidate:/ {print $2}')"
            test -n "$candidate"
            echo "candidate libc6-dbg $candidate"
            sudo apt-get install --yes --no-install-recommends \
              "libc6=$candidate" "libc6-dbg=$candidate"
          fi
          installed_libc_version="$(dpkg-query -W -f='${Version}' libc6)"
          debug_version="$(dpkg-query -W -f='${Version}' libc6-dbg)"
          test "$debug_version" = "$installed_libc_version"
          echo "libc6 before=$libc_version after=$installed_libc_version"
          echo "libc6-dbg $debug_version"

      - name: Tool provenance
        run: |
          pixi run mojo-version
          pixi run clang --version
          ldd --version | head -1

      - name: Valgrind provenance
        if: ${{ matrix.libc_debug }}
        run: pixi run valgrind --version

      # Restore this lane's build-artifact store, together with the precompiled
      # package the keys inside it were derived from. Every job starts with an
      # empty store today, so every lane recompiles every per-file test binary
      # from scratch on every run and reports `cached: 0`.
      #
      # Only the `store_cache` rows above get this, because only their mtest
      # invocations root the store in the checkout (`root = cwd()` in
      # src/main.mojo). `strict contract` scaffolds a `mkdtemp` project and runs
      # from inside it, `cache protocol` and `build stamp` build their own
      # throwaway trees, `assertions` drives `mojo build` directly and never
      # runs mtest at all, and both memory lanes compile every binary they judge
      # with `-I src` and never open a store. For all four this would move bytes
      # nothing reads.
      #
      # WHAT IT GIVES UP. AGENTS.md's "Hermetic by construction" says a lane's
      # inputs are this checkout and the locked toolchain and nothing else.
      # These three lanes stop satisfying that: a binary they run may have been
      # compiled by an earlier run of an earlier commit, and the package `mojo
      # precompile` would have produced may be restored rather than produced.
      # The trade is deliberate, and it is confined to the rows that name it.
      #
      # WHAT STILL MAKES A GREEN RUN MEAN SOMETHING. The store's key is not a
      # path. src/mtest/session/store.mojo frames the compiler's `--version`
      # bytes and its `lib/mojo` contents, the five keyed environment variables,
      # the canonicalized invocation root, the classified build arguments, every
      # include root's walked contents, and finally the test file's own
      # directory and its own bytes. A generation compiled from anything other
      # than exactly those keys differently, so a stale entry is a MISS, never a
      # wrong pass. `store_probe` then refuses to run whatever it cannot
      # re-verify: `meta.key_full` against the WHOLE key rather than the 128
      # bits the directory name carries, and `bin` characterized no-follow,
      # executable, readable, and digesting to what `meta` recorded. That
      # docstring already names an archive restore as a case it defends
      # against, which is exactly what this step performs. A failed check
      # deletes the generation instead of leaving it to be probed again.
      #
      # WHY `build/` IS IN THE PATH LIST. The store on its own would hit
      # nothing here. The classified suites compile with `-I build`
      # (`mtest_argv`, scripts/harness/selfhost.py), a walked include root
      # frames every `*.mojopkg` it finds (`_is_source_name`, store.mojo), and
      # `mojo precompile` is not byte-reproducible on this toolchain
      # (scripts/build/production_build.sh). A job that recompiles the package
      # therefore moves the shared key prefix and every per-file key hanging off
      # it, and the restored store would answer every probe with a miss. So the
      # two packages and the stamp ride in the SAME entry as the store, where
      # they cannot be paired with a store that was keyed against different
      # bytes. The stamp is what makes reusing a package safe: its input digest
      # covers that script, both stage command lines, `mojo --version`,
      # `pixi.lock`, and every file under `src/mtest` and `vendor/mojo-toml`,
      # and it re-digests the artifacts themselves -- so a restored package is
      # used only where it is a compile of exactly these sources at exactly this
      # toolchain, and is otherwise built straight over. No gate moves: `build`
      # is the package-compiles gate, both preflight jobs are uncached, and this
      # matrix cannot start until its platform's preflight has compiled the
      # package from scratch for this commit.
      #
      # WHAT STAYS COLD. `cache protocol`, on both platforms, is the deliberate
      # cold witness: absent from the rows above, driving real `build/mtest`
      # processes against throwaway projects, and the only coverage `--no-cache`
      # and `--cache-clear` have. `build stamp` stays cold one layer down, as
      # the gate proving the stamp this step leans on really does refuse a stale
      # one.
      #
      # `.mtest-cache/lastrun` is deliberately NOT restored: it is `--lf`/`--ff`
      # reselection state rather than a build output, and carrying it over would
      # let one run's failures steer the next run's selection. `CACHEDIR.TAG` IS
      # restored, because `ensure_cache_root` writes that ownership marker only
      # on the path that CREATES `.mtest-cache`; laying down the store without
      # it would materialize that directory unmarked and leave mtest unable, for
      # good, to prove it owns a directory it does own.
      #
      # The key carries the lane's task because the three cached lanes populate
      # disjoint parts of one path: one key per OS would have them race to save
      # it, and whichever won would decide what the other two restore.
      # `pixi.lock`'s hash is in the key so a toolchain re-pin is never offered
      # an entry written under the old one -- the same input the precompile
      # stamp already digests. `github.sha` makes each run publish its own entry
      # and `restore-keys` falls back to the newest surviving one for the same
      # OS, lane, and toolchain. The save runs only if the job succeeded, so a
      # red lane never seeds the next run.
      - name: Restore build-artifact store
        if: ${{ matrix.store_cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .mtest-cache/build-v1
            .mtest-cache/CACHEDIR.TAG
            build/toml.mojopkg
            build/mtest.mojopkg
            build/.precompile.stamp
          key: mtest-store-v1-${{ runner.os }}-${{ matrix.task }}-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            mtest-store-v1-${{ runner.os }}-${{ matrix.task }}-${{ hashFiles('pixi.lock') }}-

      # `matrix.workers` is set only on the `test` lane's row above; every
      # other lane leaves it unset, so this appends nothing for them.
      - name: Run ${{ matrix.lane }}
        run: pixi run ${{ matrix.task }}${{ matrix.workers && format(' -- -n {0}', matrix.workers) || '' }}

      - name: Upload safety logs
        if: ${{ always() && matrix.safety_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
          retention-days: 30

  package:
    name: Linux / packaged artifact
    runs-on: ubuntu-24.04
    # Wider than this lane's own work would suggest, because its solve reaches
    # two external channels. That is the one place in this workflow that can
    # stall on something outside the repository, and so the one place a ceiling
    # is most likely to be the thing that ends the job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          cache: true

      - name: Mojo version
        run: pixi run mojo-version

      # This independent lane intentionally solves the build environment
      # against Modular + conda-forge, then installs the local artifact into
      # fresh scratch environments while using those channels to resolve its
      # declared runtime dependency. Nothing uploads, publishes, or
      # authenticates. The macOS package job below runs the same task; both are
      # blocking, and this job's display name is an externally configured
      # required check that must not drift.
      - name: Package check
        run: pixi run package-check

  macos-preflight:
    name: macOS arm64 / preflight
    runs-on: macos-15
    # The Linux preflight's tier: the same locked Pixi install and the same kind
    # of cheap barrier, so the same ceiling reasoning applies unchanged.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          cache: true

      - name: Tool provenance
        run: |
          pixi run mojo-version
          pixi run clang --version

      # native-check owns postfork-check. build-bin owns build and
      # build-native, so invoking those dependencies separately would repeat
      # work without strengthening the gate.
      - name: Audit native adapter
        run: pixi run native-check

      - name: Build executable
        run: pixi run build-bin

      - name: Smoke-test executable
        run: ./build/mtest --help

  macos-test-matrix:
    name: macOS arm64 / ${{ matrix.lane }}
    needs: macos-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # As on the Linux matrix, a row carries only the keys it uses; there
          # are no memory lanes on this platform, so `lane`, `task`, and one
          # `workers` override are all there is to carry.
          #
          # Same reasoning as the Linux matrix's `test` row above, sized to
          # this platform's runner: a standard macos-15 (arm64) runner has 3
          # vCPUs, so `auto` (cores // 2) would give exactly 1 worker -- fully
          # serial. See DEFAULT_WORKERS in scripts/harness/selfhost.py.
          - lane: direct tests
            task: test
            workers: "3"
            store_cache: true
          - lane: assertions
            task: assertions-check
          - lane: self-hosted tests
            task: dogfood-check
            store_cache: true
          - lane: end-to-end tests
            task: e2e
            store_cache: true
          # The same two cache gates the Linux matrix runs. Both spawn real
          # processes and touch the filesystem directly, so the platform whose
          # `stat` layout and path semantics differ is exactly where they have
          # to run rather than be assumed. Neither carries `store_cache`, for
          # the reasons spelled out on the Linux rows: these two are what keeps
          # a cold store and an unrestored stamp under test on this platform.
          - lane: cache protocol
            task: cache-protocol-check
          - lane: build stamp
            task: build-stamp-check
          - lane: strict contract
            task: contract-check-strict
    runs-on: macos-15
    # The Linux matrix's wide tier, flat because this platform has no memory
    # lanes and so nothing here needs the second one.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          cache: true

      - name: Tool provenance
        run: |
          pixi run mojo-version
          pixi run clang --version

      # The Linux matrix's build-artifact cache, on this platform's runner; see
      # that step for what the trade gives up and what still holds. `runner.os`
      # sits in the key, and that is load-bearing rather than tidy: the store's
      # key frames the canonicalized invocation root, and the two platforms'
      # checkout paths differ, so an entry crossing over would miss on every
      # file it was asked about while still costing the transfer.
      - name: Restore build-artifact store
        if: ${{ matrix.store_cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .mtest-cache/build-v1
            .mtest-cache/CACHEDIR.TAG
            build/toml.mojopkg
            build/mtest.mojopkg
            build/.precompile.stamp
          key: mtest-store-v1-${{ runner.os }}-${{ matrix.task }}-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            mtest-store-v1-${{ runner.os }}-${{ matrix.task }}-${{ hashFiles('pixi.lock') }}-

      # `matrix.workers` is set only on the `test` lane's row above; every
      # other lane leaves it unset, so this appends nothing for them.
      - name: Run ${{ matrix.lane }}
        run: pixi run ${{ matrix.task }}${{ matrix.workers && format(' -- -n {0}', matrix.workers) || '' }}

  macos-package:
    name: macOS arm64 / packaged artifact
    needs: macos-preflight
    runs-on: macos-15
    # The Linux package job's tier: the same external-channel solve, and the
    # same reason for the headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          cache: true

      - name: Mojo version
        run: pixi run mojo-version

      # The same gate the Linux package job runs, resolved for osx-arm64: the
      # recipe builds into a local channel, the exact artifact is installed
      # into fresh scratch environments, and the installed binary is executed.
      # It waits on the macOS preflight because a packaged artifact is only
      # worth consuming once the source build for this platform is green.
      - name: Package check
        run: pixi run package-check
