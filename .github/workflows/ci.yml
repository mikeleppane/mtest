name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Supersede in-flight branch and PR runs; main's runs are the per-commit record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  linux-preflight:
    name: Linux / preflight
    runs-on: ubuntu-24.04
    # Every job carries a ceiling because GitHub's default is six hours and the
    # watchdogs in scripts/harness/ cannot bound the ways a hosted job hangs: a
    # `setup-pixi` that never returns, a conda solve stalled on a channel, an
    # `apt-get` waiting on a mirror. Tiers are set high enough that only a
    # wedged job hits them, never fitted to what a lane costs today, so an
    # ordinary slowdown stays a passing run. Cheapest tier: one locked Pixi
    # install and the barrier below.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs the token, and it would sit in `.git/config`.
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          # Install exactly what pixi.lock pins; fail if the lock is stale.
          locked: true
          cache: true

      - name: Mojo version
        run: pixi run mojo-version

      # THE BARRIER, AND NOTHING ELSE. Every behavioral matrix cell waits on
      # this job, so it carries only the gates that make the rest of the run
      # worthless when red. Every member is pure Python or `mojo format` over
      # this tree; anything that compiles, links, or runs a binary lives in
      # `Linux / compiled oracles` below, off this critical path. Membership and
      # order are `ci-preflight`'s, split across two jobs and not otherwise
      # changed, since that job depends on this one.
      #
      # One task per step rather than an aggregate, because GitHub names a
      # failed job by the step that failed, and the job every lane waits on has
      # to report WHICH gate went red.
      - name: Version identity
        run: pixi run version-check

      - name: Formatting
        run: pixi run fmt-check

      - name: Harness self-tests
        run: pixi run harness-unit-check

      - name: Repository policy
        run: pixi run repo-policy-check

      # A policy gate: it forbids a shape (the same foreign symbol declared in
      # two files under `tests/`) instead of compiling to detect a disagreement,
      # so it needs no compiler, package, or native object.
      - name: Foreign-declaration uniqueness
        run: pixi run abi-probe-check

      - name: Release tooling
        run: pixi run release-tooling-check

      - name: Unsafe-operation inventory
        run: pixi run safety-check

      # Ahead of `junit-render-check` in the compiled job below: the tooling has
      # to be proven to still reject a broken artifact before its verdict on
      # mtest's own emitted document means anything.
      - name: JUnit tooling
        run: pixi run junit-check

  # The `ci-preflight` members that need a real compiler, run BESIDE the
  # behavioral matrix instead of in front of it. Jobs share no filesystem and
  # this workflow uploads no build output, so nothing here feeds another job;
  # every matrix lane compiles what it needs through its own task edges.
  #
  # ONE JOB, NOT SEVERAL. Splitting further would shorten a chain that is not
  # the critical path (the barrier plus the widest behavioral lane, which
  # compiles the entire classified corpus) and charge a `setup-pixi` install and
  # a required status-check context for it. The barrier stays a dependency, so
  # nothing expensive starts until the cheap gates are green.
  linux-compiled-oracles:
    name: Linux / compiled oracles
    runs-on: ubuntu-24.04
    needs: linux-preflight
    # The matrix's wide tier: this is compiler work, at less volume than the
    # lane that tier was sized for. Fitting a narrower ceiling to what this job
    # costs is what the tier reasoning on `linux-preflight` rules out.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          cache: true

      - name: Tool provenance
        run: |
          pixi run mojo-version
          pixi run clang --version

      # `native-check` owns `postfork-check` through a dependency edge. Pixi
      # runs a shared node once per invocation, so naming both here (as
      # `ci-preflight` can) would run the audit twice across two `pixi run`s.
      - name: Audit native adapter
        run: pixi run native-check

      # Named on its own and ahead of the three checkers that pull it, as
      # `ci-preflight` writes it: an empty-but-broken package has to fail HERE,
      # under a step named for it, rather than inside whichever consumer ran
      # first. The precompile stamp turns each consumer's repeat `build` into a
      # skip, so this is one cold compile.
      - name: Compile the package
        run: pixi run build

      - name: Production artifact profile
        run: pixi run build-profile-check

      - name: README CLI reference
        run: pixi run readme-help-check

      # Runs here rather than in the static preflight because it needs the
      # built binary to render the scripts, and on linux-64 because that is
      # where the pinned zsh and fish are declared: this is the require-all
      # run of the completion oracle.
      - name: Shell completion scripts
        run: pixi run completions-check

      - name: Rendered JUnit document
        run: pixi run junit-render-check

      - name: Protocol snapshots
        run: pixi run transcripts-check

      # Last, as in `ci-preflight`: a nonzero exit here indicts the toolchain
      # pin rather than the tree, which only reads correctly once the gates that
      # do indict the tree have passed.
      - name: Coverage tripwire
        run: pixi run coverage-capability

  linux-test-matrix:
    name: Linux / ${{ matrix.lane }}
    # The barrier only. `Linux / compiled oracles` is blocking and runs beside
    # this matrix, which costs runner time and no verdict: a commit whose
    # package does not compile burns every cell discovering that in parallel.
    # Runners share nothing, so each cell already compiles what it needs through
    # its own task edges and reddens on its own evidence.
    needs: linux-preflight
    strategy:
      # Every lane is an independent gate over one commit, and a reviewer has to
      # act on the whole set, so one red must not cancel the other verdicts.
      fail-fast: false
      matrix:
        include:
          # A row carries only the keys it uses. An absent matrix key evaluates
          # falsy, which is what every `if:` and the `timeout-minutes` fallback
          # below read.
          #
          # `lane` values and job `name` values are externally configured
          # required status-check contexts: renaming one leaves a permanently
          # pending check.
          #
          # A public ubuntu-24.04 runner has 4 vCPUs, so `pixi run test`'s
          # `auto` default (half the cores, src/mtest/session/pool_plan.mojo)
          # would use 2. This override is sized to the runner; see
          # DEFAULT_WORKERS in scripts/harness/selfhost.py for why it lives here
          # rather than in pixi.toml.
          - lane: classified suite
            task: test
            workers: "4"
          - lane: assertions
            task: assertions-check
          - lane: end-to-end tests
            task: e2e
          # Drives real `build/mtest` processes against throwaway projects,
          # concurrently and under the publication fault seam, asserting the
          # store's protocol properties from outside the process. The only
          # coverage `--no-cache` and `--cache-clear` have.
          - lane: cache protocol
            task: cache-protocol-check
          # Guards the production build's precompile stamp, the one thing that
          # keeps a `pixi run build` over changed sources from linking against
          # a package compiled from the previous ones.
          - lane: build stamp
            task: build-stamp-check
          - lane: strict contract
            task: contract-check-strict
          # Both memory lanes build every binary they judge from source, so no
          # `pixi run build` precedes them and neither reads `build/mtest` or
          # `build/mtest.mojoc`: the shipped artifact is uninstrumented and
          # carries no `-g` guarantee, so reusing it would defeat the lane. See
          # the CLI_BINARY docstrings in scripts/checks/memory/asan.py and
          # scripts/checks/memory/valgrind.py.
          - lane: ASan + LSan
            task: asan-check
            safety_artifact: true
            artifact_name: asan-logs
            artifact_path: build/safety/asan/*.log
            timeout: 30
          - lane: Valgrind Memcheck
            task: valgrind-check
            libc_debug: true
            safety_artifact: true
            artifact_name: valgrind-logs
            artifact_path: build/safety/valgrind/*.log
            timeout: 30
    runs-on: ubuntu-24.04
    # The wide tier, sized for `classified suite`, which runs the whole
    # discovered corpus; every other lane here does strictly less. See the tier
    # reasoning on `linux-preflight` for why it is not fitted to a lane's cost.
    #
    # The two memory lanes take a tighter ceiling from their own rows, each
    # running a bounded inventory its own checker enumerates. They also gain the
    # most from a ceiling: BUILD_TIMEOUT in scripts/checks/memory/asan.py
    # budgets each instrumented build separately and that lane runs sixteen of
    # them, so the per-build guards sum past any job worth waiting for. The
    # value rides on the row it applies to rather than in a ternary, so a third
    # tier costs one key.
    timeout-minutes: ${{ matrix.timeout || 40 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          cache: true

      # The only post-Pixi network exception among the source, test, and memory
      # lanes, confined to this cell. It is bounded to glibc debug symbols
      # MATCHING the libc6 this cell runs against, which is what Memcheck reads;
      # it does not promise libc6 itself never moves.
      - name: Install matching glibc debug symbols
        if: ${{ matrix.libc_debug }}
        run: |
          libc_version="$(dpkg-query -W -f='${Version}' libc6)"
          echo "preinstalled libc6 $libc_version"
          sudo apt-get update
          apt-cache policy libc6 libc6-dbg
          # Prefer the preinstalled revision so nothing else on the image moves.
          # The archive drops superseded glibc revisions, so that pin becomes
          # unsatisfiable as soon as the runner image lags a security update
          # (observed with libc6 2.39-0ubuntu8.7 preinstalled and only 8.8 left
          # in noble-updates). The property Memcheck needs is that libc6-dbg
          # MATCHES the installed libc6, not that libc6 is pinned, so the
          # fallback moves both to the archive's current revision together and
          # the assertion below compares them. Upgrading one without the other
          # is the outcome that must never pass.
          if ! sudo apt-get install --yes --no-install-recommends \
              "libc6-dbg=$libc_version"; then
            echo "libc6-dbg=$libc_version unavailable; moving libc6 and libc6-dbg together"
            candidate="$(apt-cache policy libc6-dbg | awk '/Candidate:/ {print $2}')"
            test -n "$candidate"
            echo "candidate libc6-dbg $candidate"
            sudo apt-get install --yes --no-install-recommends \
              "libc6=$candidate" "libc6-dbg=$candidate"
          fi
          installed_libc_version="$(dpkg-query -W -f='${Version}' libc6)"
          debug_version="$(dpkg-query -W -f='${Version}' libc6-dbg)"
          test "$debug_version" = "$installed_libc_version"
          echo "libc6 before=$libc_version after=$installed_libc_version"
          echo "libc6-dbg $debug_version"

      - name: Tool provenance
        run: |
          pixi run mojo-version
          pixi run clang --version
          ldd --version | head -1

      - name: Valgrind provenance
        if: ${{ matrix.libc_debug }}
        run: pixi run valgrind --version

      # `matrix.workers` is set only on the `test` row, so this appends nothing
      # for the other lanes.
      - name: Run ${{ matrix.lane }}
        run: pixi run ${{ matrix.task }}${{ matrix.workers && format(' -- -n {0}', matrix.workers) || '' }}

      - name: Upload safety logs
        if: ${{ always() && matrix.safety_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
          retention-days: 30

  package:
    name: Linux / packaged artifact
    runs-on: ubuntu-24.04
    # Wider than this lane's own work needs, because its solve reaches two
    # external channels. That is the one place here that can stall on something
    # outside the repository, and so where a ceiling is most likely to fire.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          cache: true

      - name: Mojo version
        run: pixi run mojo-version

      # Solves the build environment against Modular + conda-forge, then
      # installs the local artifact into fresh scratch environments, resolving
      # its declared runtime dependency from those channels. Nothing uploads,
      # publishes, or authenticates. The macOS package job runs the same task;
      # both are blocking, and this job's display name is an externally
      # configured required check.
      - name: Package check
        run: pixi run package-check

  python-quality:
    name: Python quality
    runs-on: ubuntu-24.04
    # Independent of the preflight on purpose: this job judges the build and
    # check tooling, not the product, and no other lane's verdict depends on its
    # answer. It takes the package jobs' tier for their reason rather than for
    # the work involved: `setup-uv` fetches a release and `uvx` resolves ruff
    # and mypy from an index, and an external fetch is where a ceiling is most
    # likely to fire.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          cache: true

      # `py-check` shells out to `uvx`, deliberately absent from the Pixi
      # environment: taking ruff and mypy as dependencies would change the
      # environment the product is built in. See the `py-check` comment in
      # pixi.toml and the module docstring in scripts/checks/python_quality.py.
      # Hence a step of its own here rather than a line in `ci-preflight`.
      #
      # uv is pinned for the same reason RUFF_VERSION and MYPY_VERSION are
      # pinned in that module: uv resolves them and provisions the interpreter
      # mypy runs under, so an unpinned uv could move the verdict with no line
      # changing in this repository. Its download cache is left off because both
      # tools are pinned exactly, so what gets fetched is already determined.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.17"
          enable-cache: false

      # ruff format --check, ruff check, and mypy --strict over every Python
      # root. Check mode rewrites nothing and fails on any finding; the `--fix`
      # sibling (`pixi run py-fmt`) is local-only, and a tree it has not been
      # run over is what this job catches.
      - name: Lint, format, and type-check Python
        run: pixi run py-check

  macos-preflight:
    name: macOS arm64 / preflight
    runs-on: macos-26
    # The Linux preflight's ceiling leaves ample room for the native and profile
    # compiles this platform-specific barrier owns.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          cache: true

      - name: Tool provenance
        run: |
          pixi run mojo-version
          pixi run clang --version

      # The barrier on this platform carries the two `ci-preflight` answers
      # that are platform-specific. `native-check` owns `postfork-check`, so
      # naming that separately would repeat the audit without strengthening
      # the gate.
      #
      # The production-profile step intentionally builds here before releasing
      # the behavioral matrix. It proves native apple-m1 IR and the exact macOS
      # 14.0 minimum on the real binary. The Linux repository-policy barrier
      # separately pins -g0 in both profiles' exact link argv. Jobs share no
      # filesystem, so the cells below still build their own inputs.
      - name: Audit native adapter
        run: pixi run native-check

      - name: Production artifact profile
        run: pixi run build-profile-check

  macos-test-matrix:
    name: macOS arm64 / ${{ matrix.lane }}
    needs: macos-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # As on the Linux matrix, a row carries only the keys it uses, and
          # `lane` is an externally configured required-check name. A macos-26
          # arm64 runner has 3 vCPUs, so `auto` (cores // 2) would give exactly
          # 1 worker. See DEFAULT_WORKERS in scripts/harness/selfhost.py.
          - lane: classified suite
            task: test
            workers: "3"
          - lane: assertions
            task: assertions-check
          - lane: end-to-end tests
            task: e2e
          # The same two cache gates the Linux matrix runs. Both spawn real
          # processes and touch the filesystem directly, so the platform whose
          # `stat` layout and path semantics differ is exactly where they have
          # to run rather than be assumed.
          - lane: cache protocol
            task: cache-protocol-check
          - lane: build stamp
            task: build-stamp-check
          - lane: strict contract
            task: contract-check-strict
    runs-on: macos-26
    # The Linux matrix's wide tier, flat because this platform has no memory
    # lanes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          cache: true

      - name: Tool provenance
        run: |
          pixi run mojo-version
          pixi run clang --version

      # `matrix.workers` is set only on the `test` row, so this appends nothing
      # for the other lanes.
      - name: Run ${{ matrix.lane }}
        run: pixi run ${{ matrix.task }}${{ matrix.workers && format(' -- -n {0}', matrix.workers) || '' }}

  macos-package:
    name: macOS arm64 / packaged artifact
    needs: macos-preflight
    runs-on: macos-26
    # The Linux package job's tier, for the same external-channel solve.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          cache: true

      - name: Mojo version
        run: pixi run mojo-version

      # The same gate the Linux package job runs, resolved for osx-arm64. It
      # waits on the macOS preflight because the recipe build compiles the very
      # adapter that job audits, and a packaged artifact is only worth consuming
      # once that audit is green. What it waits for is that verdict, never an
      # artifact: `package-check` builds from source inside rattler-build's
      # isolated environment and reads nothing the preflight produced.
      - name: Package check
        run: pixi run package-check
