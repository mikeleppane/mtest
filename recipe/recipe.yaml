# mtest distribution recipe (rattler-build).
#
# Builds mtest FROM SOURCE inside rattler-build's ISOLATED build environment —
# `mojo ==1.0.0b2` (+ the pinned C toolchain) installs and runs there, so this
# recipe mirrors the repo's own build -> build-native -> build-bin pipeline
# rather than repackaging a prebuilt binary. See recipe/build.sh for the exact
# steps.
#
# Targets: linux-64 and osx-arm64 are both GATED. Each has its own blocking CI
# job that builds this recipe into a local channel, installs the exact artifact
# it produced into a fresh environment carrying only the declared run
# dependency, and executes the installed binary (`pixi run package-check`).
# Neither platform is a documented ceiling any more.
schema_version: 1

context:
  version: "1.1.0"

package:
  name: mtest
  version: ${{ version }}

source:
  - path: ..

build:
  number: 0
  script: build.sh
  # Closed inventory of what mtest itself installs. Declaring `mojo-compiler`
  # under `host` puts it in $PREFIX for the build, and activating it writes
  # `share/max/firstActivation` there; without this list that marker is a new
  # prefix file and rattler-build packages it. Both globs are rooted in paths
  # mtest owns, so a foreign file can never enter the artifact and a file this
  # recipe stops installing fails the packaged-inventory test rather than
  # silently vanishing.
  files:
    - bin/mtest
    - share/mtest/companions/assertions/src/mtest/**

requirements:
  # Build-time only: the isolated env this script runs in. Pinned to the same
  # versions pixi.toml pins for local/CI builds so the recipe's build matches
  # the repo's proven build exactly.
  build:
    - mojo ==1.0.0b2
    - clang ==18.1.8
  # Host: the target-side libraries the produced binary links against, named
  # here as the package that owns them rather than being taken implicitly from
  # the build environment. `mojo` above is the compiler driver that EXECUTES on
  # the build machine; `mojo-compiler` owns `libKGENCompilerRTShared` and the
  # runtime closure the binary carries a load command for, so the link inputs
  # and the run dependency below now name one package at one pinned version.
  # Both gate targets build natively, so this section changes no resolution
  # today; it states the contract the `run` dependency has always relied on.
  host:
    - mojo-compiler ==1.0.0b2
  # Run-time: the installed `mtest` binary is NOT loader-clean on its own, in
  # either object format. On linux-64 `readelf -d` shows a direct ELF NEEDED on
  # `libKGENCompilerRTShared.so`; on osx-arm64 `otool -L` shows the
  # corresponding Mach-O load command for the same runtime library. Its
  # transitive closure pulls in the Mojo-runtime libraries (libMSupportGlobals,
  # libAsyncRTRuntimeGlobals, libNVPTX, libAsyncRTMojoBindings) that
  # `mojo-compiler-1.0.0b2-release` owns, plus the platform's standard C++
  # runtime (libstdc++/libgcc_s on Linux, libc++ on macOS) — which the base
  # environment provides and `mojo-compiler` itself depends on, NOT libraries
  # mtest vendors or that mojo-compiler "owns". The native adapter is statically
  # linked (no extra load command on either platform), so it adds no run
  # dependency of its own. Declaring `mojo-compiler` therefore drags in the
  # whole native closure transitively. package-check proves this dependency
  # empirically ON BOTH PLATFORMS, in a fresh environment carrying only the
  # declared run dependency with that platform's loader search path emptied.
  run:
    - mojo-compiler ==1.0.0b2

tests:
  # Installs the just-built package into a fresh test env carrying ONLY the
  # declared run dependency and executes the installed binary directly —
  # proving the dependency above is sufficient for the binary to load and run.
  - script:
      - mtest --version

about:
  homepage: https://github.com/mikeleppane/mtest
  license: MIT
  license_file: LICENSE
  summary: A pytest-like test runner for Mojo that orchestrates the stdlib's per-file TestSuite
