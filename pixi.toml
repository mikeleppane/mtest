[workspace]
name = "mtest"
version = "1.0.0"
description = "A pytest-like test runner for Mojo that orchestrates the stdlib's per-file TestSuite"
channels = ["https://conda.modular.com/max/", "conda-forge"]
# Both gate targets, sharing the POSIX process surface the runner depends on.
# Bumping the set is an Ask-first decision: the Linux-only protocol snapshots
# are stamped with os/arch, so regenerating them elsewhere diffs loudly.
platforms = ["linux-64", "osx-arm64"]

[dependencies]
# The toolchain IS the oracle: the protocol snapshots pin TestSuite's behavior
# at exactly this version, and the version appears in every transcript header.
# Bumping mojo is an Ask-first decision. CI must match local, and a bump can
# change both valid syntax and the pinned protocol, so regenerate the
# transcripts and read the diff as the changelog. See AGENTS.md.
mojo = "==1.0.0b2,<2"
# Build and check tooling only. Product code and project-config parsing are
# native Mojo, and the shipped package has no Python dependency.
python = "3.12.*"
# The POSIX adapter is a build-time C object linked into Mojo executables. One
# pinned compiler on both targets keeps its ABI and sanitizer behavior
# reproducible; the linked object adds no runtime library dependency.
clang = "==18.1.8"
clang-tools = "==18.1.8"
# xmllint checks the vendored junit-10.xsd against the shipped artifact. Pinned
# so the JUnit gate's verdict cannot drift with an unpinned system copy.
libxml2 = "==2.15.3"
# Builds recipe/recipe.yaml into a local conda channel. Build-time only, and
# pinned exact so the recipe's proven isolated-build-env behavior cannot drift.
rattler-build = "==0.69.1"
# check-jsonschema validates both recipes against the vendored recipe-format
# schema. Pinned for the same reason as libxml2: the gate's verdict must not
# drift with an unpinned system copy. modular-community's own recipe-lint hook
# never fires (see scripts/checks/community_recipe.py), so this owns that check.
check-jsonschema = "==0.37.4"

[tasks]
# Print the pinned Mojo version. First CI step, so a broken toolchain fails fast
# and the exact build is stamped into the log beside the transcript headers.
mojo-version = "mojo --version"

# Assert MTEST_VERSION (src/mtest/cli/parser.mojo), this manifest's `version`,
# and the conda recipe's agree with each other and with the version this repo
# ships. Also proves every rendered transcript in `README.md`,
# `docs/cli-contract.md`, and the two banner SVGs matches the release, and that
# a site rendering none at all fails too, because a restructure that dropped the
# transcripts would otherwise pass vacuously. Sweeps every tracked file for a
# rendered version so a new page carrying one cannot be ungated from birth: an
# undeclared match fails until it is named a site or an explicit exemption.
# Finally holds every restatement of the Mojo pin -- both conda recipes, the
# recipe build script, and the prose in the README, the contract, the changelog,
# the contributing guide, and the agent guide -- against the one pin above, so a
# toolchain bump cannot leave the shipped package asking for the old compiler.
# Runs first because drift here means every later gate is validating a lie about
# which release it covers.
version-check = "python -m scripts.checks.version"

# The write side of `version-check`: rewrite the release version across all nine
# files that carry it in one edit, e.g. `pixi run bump 1.1.0`. Every one of the
# nine is gated — `version-check` holds the three manifests and the four public
# transcript surfaces against its own pin, and `scripts/qa/contract.py` fails at
# the contract gate — and the four transcript sites are defined once by
# `version-check` itself and imported here, so writer and checker cannot drift.
# Not wired into `pixi run ci`; this is the first step of cutting a release, and
# `version-check` is what proves it landed. Refuses to touch a tree whose sites
# already disagree, so drift gets repaired rather than buried under a bump.
bump = "python -m scripts.release.bump"

# Precompile the vendored TOML parser and src/mtest into build/toml.mojoc and
# build/mtest.mojoc. The package-compiles GATE: an empty-but-broken package
# fails here before any test does. `mojo package` does not exist in 1.0.0b2;
# `mojo precompile` produces the compiled artifacts.
build = "bash scripts/build/mojo_package.sh"

# Compile the exec-private C adapter to the one production object linked into
# every Mojo executable that can instantiate mtest.exec. The ABI checker proves
# the test-only fault/sanitizer controls are absent from this artifact.
build-native = "python -m scripts.build.native"

# Link build/mtest from src/main.mojo through the shared production-build
# authority's link stage (scripts/build/production_build.sh), the same
# definition the packaged recipe build uses, so the checkout and the published
# link line cannot drift. Depends on `build` so `-I build` resolves
# `from mtest... import` against the precompiled package rather than the whole
# source tree, and on `build-native` for the production object it links.
build-bin = { cmd = "bash scripts/build/production_build.sh link", depends-on = [
    "build",
    "build-native",
] }

# Verify the real production binary and matching compiler IR against independent
# CPU-feature, stripped-debug, and deployment-target oracles. The command tests
# first pin the shell-rendered Linux/Darwin argv, then the checker emits IR for
# both a minimal probe and src/main.mojo and inspects build/mtest itself.
build-profile-check = { cmd = "python -m scripts.tests.test_build_profiles && python -m scripts.tests.test_build_profile && python -m scripts.checks.build_profile", depends-on = [
    "build-bin",
] }

# Keep README's committed CLI reference byte-identical to the real binary. The
# `build-bin` edge stops standalone use from reading a stale or missing binary.
readme-help-check = { cmd = "python -m scripts.checks.readme_help", depends-on = [
    "build-bin",
] }

# Build recipe/recipe.yaml into a LOCAL conda channel: rattler-build solves an
# isolated build env (mojo ==1.0.0b2 plus the C toolchain), builds mtest FROM
# SOURCE inside that sandbox, and writes the .conda under
# build/conda-channel/<subdir>, a plain directory with repodata.json. Nothing is
# uploaded or published. Not wired into `pixi run ci`; each platform's package
# job runs independently of the test chains.
package-build = "rattler-build build --recipe recipe/recipe.yaml -c https://conda.modular.com/max/ -c conda-forge --output-dir build/conda-channel"

# The packaged-artifact consumption GATE, identical on both gated platforms:
# build, install THAT EXACT artifact (version, build string, and the installed
# conda-meta SHA-256) into a FRESH scratch env from the local channel, then
# probe the INSTALLED binary with the dev pixi env off PATH and this platform's
# loader search path empty; on Darwin, recursively audit its non-system Mach-O
# dependency closure for prefix containment and a <=14.0 minimum; run the
# dogfood probes and the known-failing fixture through it; and repeat the
# install from the tar-bz2 fallback format. Depends
# on build + build-native (not build-bin) so this repo's package and
# test-variant object exist for the probe run; the binary under test is the
# INSTALLED one, never build/mtest. NOT wired into `pixi run ci`; each
# platform's CI package job is independent. Nothing uploads or publishes.
package-check = { cmd = "python -m scripts.build.package_consumption", depends-on = [
    "build",
    "build-native",
] }

# Rewrite Python files in place: ruff format, then ruff's safe lint fixes. Run
# locally before committing, the same way `fmt` is run for Mojo.
py-fmt = "python -m scripts.checks.python_quality --fix"

# The Python quality verdict: formatting drift, any lint finding, or any mypy
# --strict error fails. Out of the local floor because ruff and mypy run through
# `uvx`, which is not a pixi dependency; the hosted `Python quality` job may run
# it because it installs a pinned `uv` itself. The checker fails loudly when
# `uvx` is absent instead of skipping. See scripts/checks/python_quality.py for
# why the versions are pinned exactly.
py-check = "python -m scripts.checks.python_quality"

# Rewrite every real Mojo file in its own invocation. Mojo 1.0.0b2 can stall
# when one formatter invocation spans several paths. `find -P` does not traverse
# symlinks; the C-locale sort fixes ordering.
mojo-fmt = '''sh -c '
set -eu
source_list="$(mktemp "${TMPDIR:-/tmp}/mtest-format.XXXXXX")"
sorted_list="${source_list}.sorted"
trap "rm -f \"$source_list\" \"$sorted_list\"" EXIT HUP INT TERM
find -P src companions tests e2e recipe -type f -name "*.mojo" -print > "$source_list"
LC_ALL=C sort "$source_list" > "$sorted_list"
mv "$sorted_list" "$source_list"
if [ ! -s "$source_list" ]; then
    echo "FATAL: fmt: no Mojo sources found" >&2
    exit 1
fi
while IFS= read -r source; do
    mojo format --quiet "$source"
done < "$source_list"
'
'''

# Rewrite the complete Git-tracked native C/header inventory through the pinned
# ClangFormat configuration and preserve the native ASCII-only invariant.
native-fmt = "python -m scripts.checks.native_format"

# The ordinary formatting path owns both source languages.
fmt = { depends-on = ["mojo-fmt", "native-fmt"] }

# CI gate: format, then fail if anything changed. A format that shifts a
# fixture's `At <path>:<line>:<col>` coordinates is an oracle-side change:
# regenerate transcripts, do not fight the gate.
fmt-check = { cmd = "git diff --exit-code", depends-on = ["fmt"] }

# Stdlib-only unsafe-operation inventory. Mutation tests pin every syntax family
# and string/comment exclusion; the inventory must stay documented before the
# ordinary CI gate proceeds.
safety-check = "python -m scripts.tests.test_safety && python -m scripts.checks.safety"

# Recurring Clang call-graph audit for the complete post-fork child region.
# Mutation tests prove forbidden direct, wrapped, and indirect calls fail closed;
# both production and testing preprocessing variants must match the exact
# platform allowlist.
postfork-check = "python -m scripts.tests.test_postfork && python -m scripts.checks.postfork"

# Parse-smoke then analyze every native C translation unit with the exact
# strict host compilation context. The root `.clang-tidy` exclusively owns the
# analyzer selection; the driver never overrides it.
clang-tidy-check = "python -m scripts.tests.test_native_tidy && python -m scripts.checks.native_tidy"

# Strict C17 ABI/layout/symbol verification plus native lifecycle tests for the
# private exec adapter. The standalone post-fork and Clang-Tidy audits are
# prerequisites. This remains separate from the Mojo suite so the test object
# can expose deterministic fault and sanitizer controls that production linkage
# proves absent.
native-check = { cmd = "python -m scripts.tests.test_native && python -m scripts.checks.native", depends-on = [
    "postfork-check",
    "clang-tidy-check",
    "build-native",
] }

# Source-build the native adapter and a risk-weighted exec subset with matching
# AddressSanitizer instrumentation. Live OOB/UAF/leak controls prove that both
# the compiler instrumentation and fail-closed harness remain effective.
asan-check = "python -m scripts.tests.test_asan && python -m scripts.checks.memory.asan"

# The memory-safety aggregate that closes `pixi run ci`, and the standalone
# entry point for running just the two lanes. On linux-64 the platform-scoped
# override below replaces this command with the real dependency edges onto
# `asan-check` and `valgrind-check`; this base definition is what every other
# platform executes, and it reports the uncovered lanes loudly instead of
# passing quietly. Both lanes belong in the floor rather than beside
# `bench-workers` because their verdict is a machine-independent pass or fail,
# so there is a threshold they can be red against.
ci-memory = "python -m scripts.checks.memory.host_support"

# Source-build every exec integration suite with debug information and run it
# under the locked Linux-only Memcheck binary. Undefined-value, invalid-access,
# leak, and fd controls run first; reviewed runtime-reachable allocations are
# matched exactly and project/native frames are forbidden from that baseline.
# The hosted Valgrind cell has a narrow approved apt exception for glibc debug
# symbols matching the libc6 it runs against: the preinstalled revision where
# the archive still carries it, otherwise libc6 and libc6-dbg moved together to
# the archive's current one and asserted equal. No other source, test, or memory
# step has that exception, and this task is not hermetic.
valgrind-check = "python -m scripts.tests.test_valgrind && python -m scripts.checks.memory.valgrind"

# Gate the JUnit report tooling ahead of the renderer that will use it: unit
# tests first prove the checker rejects a broken artifact, then the checker runs
# xmllint against the vendored junit-10.xsd plus the arithmetic and structural
# invariants the schema cannot express.
junit-check = "python -m scripts.tests.test_junit && python -m scripts.checks.reports.junit"

# Gate mtest's OWN rendered JUnit document through the same junit-10 oracle:
# build and run tests/fixtures/junit/junit_emit.mojo, which drives the real
# JunitReporter over every sentinel-matrix cell, then run the schema and
# arithmetic checker over the emitted document and confirm a tampered copy is
# rejected. This validates the shipped renderer's bytes, where junit-check
# validates a mock. Depends on the precompiled package so the emitter can
# import mtest.report.
junit-render-check = { cmd = "python -m scripts.checks.reports.junit_render", depends-on = [
    "build",
] }

# Regenerate the protocol snapshots IN PLACE from the committed fixtures at the
# pinned toolchain. Local use only; never run in CI. The generator self-verifies
# with hard asserts before writing.
transcripts = "python -m scripts.gen_transcripts"
# CI gate: regenerate every transcript into a temp dir and diff byte-for-byte
# against tests/snapshots/protocol/, MANIFEST included. This is the protocol
# pin: a red diff after a repo change indicts THE CHANGE; a red diff after a
# mojo re-pin is the protocol changelog. Hermetic.
transcripts-check = "python -m scripts.checks.protocol_snapshots"

# Contributor-friendly entry point for the CLI contract oracle against an
# external throwaway project: rebuild-if-stale, filterable, not strict by
# default. Pixi forwards arguments after `--`, e.g. `pixi run contract-check --
# --strict`. `contract-check-strict` below is the blocking gate; this one is for
# local iteration (`-k`, `--keep`, `-v`).
contract-check = "python -m scripts.qa.contract"

# The blocking release-floor gate: every documented exit, stream, and
# environment behavior in docs/cli-contract.md, asserted --strict (a SKIP fails)
# against the binary this invocation's `build-bin` dependency just produced,
# with the checker forbidden from starting another build (`--no-rebuild`). That
# task edge, not the checker's own mtime probe, is what proves the binary under
# test came from THIS tree; BINARY_INPUT_PATHS in scripts/qa/contract.py is the
# fail-closed backstop.
contract-check-strict = { cmd = "python -m scripts.qa.contract --strict --no-rebuild", depends-on = [
    "build-bin",
] }

# Measure how the parallel scheduler scales with the worker count, to keep the
# `auto` sizing honest against a real machine. Drives the built binary over a
# synthetic medium-weight tree across workers x tokens x cold/warm and prints
# the median wall clock plus speedup against `-n 1`. A MAINTENANCE task,
# deliberately NOT in `pixi run ci`: it produces a machine-specific measurement,
# not a verdict, so there is no threshold it could be red against. Run under
# `pixi run` so the spawned `mojo build` children resolve `mojo`; build the
# binary first (`pixi run build-bin`).
bench-workers = "python -m scripts.maintenance.bench_workers"

# The exhaustive test gate: runs mtest's own classified suite THROUGH
# `build/mtest` itself, one real invocation of the runner under test, supervised
# by a whole-process-group watchdog, with its own report reconciled against a
# source-derived inventory rather than trusted (scripts/harness/selfhost.py).
# `mojo run` never appears in the gate because it masks crash exit codes to 1.
# Depends on `build-bin`, which supplies everything a self-hosted run needs:
# `build/mtest` and `build/native/mtest_exec_native_test.o`. The worker count
# stays at the module's `auto` default here; see DEFAULT_WORKERS in
# scripts/harness/selfhost.py for why a fixed integer belongs in CI's workflow
# instead. Investigate a single failure with
# `pixi run test-file -- tests/unit/test_model_outcome.mojo`.
test = { cmd = "python -m scripts.harness.selfhost tests/unit tests/integration", depends-on = [
    "build-bin",
] }
test-unit = { cmd = "python -m scripts.harness.selfhost tests/unit", depends-on = [
    "build-bin",
] }
test-integration = { cmd = "python -m scripts.harness.selfhost tests/integration", depends-on = [
    "build-bin",
] }
test-file = { cmd = "python -m scripts.harness.selfhost", depends-on = [
    "build-bin",
] }

# Compile and directly execute the public source-only assertion consumers at
# both optimization levels. This task owns its checker self-tests EXCLUSIVELY,
# so stale binaries, skipped tests, and provider-side source locations fail
# closed in the same invocation that would have consumed them. They stay here
# rather than on the hosted preflight, the one job every behavioral lane waits
# on, because this task already runs them in its own matrix cell on BOTH
# platforms. Dropping `assertions-check` from either matrix would leave the
# self-tests without an owner.
assertions-check = "python -m scripts.tests.test_assertions && python -m scripts.checks.assertions"

# Render and semantically compare the reviewed modular-community recipe. Its
# tests cover canonical manifests and bounded staging; the checker keeps the
# local rattler-build recipe and the submission template from drifting apart.
#
# This is the SOLE definition of that pair, and the narrower handle a
# contributor editing recipe/recipe.yaml actually wants, without the four
# release-publication suites beside it. `release-tooling-check` reaches it
# through `depends-on`, which Pixi runs before that task's own `cmd`, so the
# recipe pair still executes first.
recipe-check = "python -m scripts.tests.test_community_recipe && python -m scripts.checks.community_recipe"

# Fast self-tests for repository harness behavior: the self-hosted runner's
# reconciliation, its timeout and interrupt handling, the dogfood and e2e
# drivers, the CLI-contract and transcript comparators, the README-help
# extractor, and the fully-mocked branch logic of `coverage-capability`, whose
# real run needs a real `mojo` and lives as its own preflight task. Every member
# uses disposable test inputs and a fake compiler, so nothing here waits on a
# compiler or a built binary, which is why it sits ahead of every preflight
# member that does. `test_assertions` is deliberately absent: `assertions-check`
# owns it and runs it in its own matrix cell on both platforms.
#
# The two memory-lane self-tests run here as well as inside their own lanes.
# They need neither valgrind nor a sanitizer build, and one of them holds the
# only check that the probe oracle duplicated into both lanes has not diverged.
# Left solely in `valgrind-check` that check is unreachable on macOS and costs a
# full instrumented lane on Linux to learn a docstring was reworded in one copy.
harness-unit-check = "python -m scripts.tests.test_process_watchdog && python -m scripts.tests.test_dogfood && python -m scripts.tests.test_package_consumption && python -m scripts.tests.test_selfhost && python -m scripts.tests.test_e2e && python -m scripts.tests.test_e2e_json && python -m scripts.tests.test_contract && python -m scripts.tests.test_transcript_compare && python -m scripts.tests.test_readme_help && python -m scripts.tests.test_coverage_capability && python -m scripts.tests.test_abi_probe && python -m scripts.tests.test_asan && python -m scripts.tests.test_valgrind && python -m scripts.tests.test_native_format && python -m scripts.tests.test_build_profiles"

# Repository policy: does this tree still obey its own rules? The public-version
# oracle, the documentation-site parity oracle, the layout and invocation-policy
# oracle, the hosted-workflow security
# oracle, the Python-quality runner's pinning and failure policy, and the
# GitHub-annotation tail oracle, each preceded by the mutation tests that prove
# it still rejects a broken input, because a checker that has quietly stopped
# rejecting anything is worse than no checker. Separate from
# `harness-unit-check` because that group is red when the harness broke and this
# one is red when a change violated a policy the harness enforces fine, and a
# hosted lane should say which. Note `test_python_quality` runs here while
# `py-check` itself runs nowhere in the floor (see its comment): the version pin
# and the fail-loudly-without-uvx policy are asserted without the tool being
# present. `test_version` runs here while `version-check` itself runs first in
# the floor, for the same reason: the oracle's rejections are proved against
# fabricated trees, not against this one. `docs_parity` DOES run here rather
# than only in the floor: it reads documents alone, needs no compiler or built
# binary, and the drift it catches — a documentation-site page whose command no
# longer matches the README block it mirrors — is a policy violation of exactly
# the kind this group exists to name.
repo-policy-check = "python -m scripts.tests.test_version && python -m scripts.tests.test_docs_parity && python -m scripts.checks.docs_parity && python -m scripts.tests.test_layout && python -m scripts.checks.layout && python -m scripts.tests.test_workflow_security && python -m scripts.checks.workflow_security && python -m scripts.tests.test_python_quality && python -m scripts.tests.test_annotations_oracle"

# Release tooling: the community recipe (through the `recipe-check` edge, which
# Pixi runs first), then the attestation schema, the GitHub release-state and
# tag-dereference driver, the community channel/PR/credential driver,
# public-channel verification, and the version-bump writer. All five suites
# drive the release drivers over fabricated state in temporary directories or
# read-only against this tree; none reaches a network or a real channel, and the
# genuine publication path is gated by the release workflows. Separate because
# these fail for release-process reasons (an attestation field, a tag form, a
# fork's branch state, a bump site the gate does not cover) that say nothing
# about the harness or about policy.
release-tooling-check = { cmd = "python -m scripts.tests.test_release_attestations && python -m scripts.tests.test_github_release && python -m scripts.tests.test_community_publication && python -m scripts.tests.test_public_verify && python -m scripts.tests.test_bump", depends-on = [
    "recipe-check",
] }

# The aggregate of the three groups above, kept because `harness-check` is the
# name contributors and AGENTS.md already use for "run the whole hermetic
# tooling floor". `ci-preflight` deliberately does NOT go through it (see the
# note there), so this is a convenience handle, not a gate node.
#
# Cross-group order is cheapest-and-broadest first. All three are hermetic and
# no group reads anything another writes, so the order only decides how fast a
# human learns something useful, and a layout or workflow-security violation is
# the finding most likely to indict the change in front of you. Order WITHIN
# each group is untouched, because those sequences were tuned to fail fast.
harness-check = { depends-on = [
    "harness-unit-check",
    "repo-policy-check",
    "release-tooling-check",
] }

# One declarer per external_call symbol across the classified tree. Two
# classified test_*.mojo modules build as separate binaries, so nothing compares
# their declarations of the same symbol, and a drift in arity or parameter type
# between them is silent garbage at the ABI boundary rather than a compile
# error. Every symbol more than one suite needs is declared exactly once, in
# tests/support/foreign_abi.mojo, and this check fails if a second declaration
# reappears. Forbidding the shape reads sources rather than building them, so it
# needs no compiler, precompiled package, or native test object.
abi-probe-check = "python -m scripts.checks.abi_probe"

# A fail-closed TRIPWIRE in `ci-preflight`: ask the pinned toolchain whether it
# has grown a source-coverage facility. Mojo 1.0.0b2 has none, neither `mojo
# build --help` nor `mojo --help` naming a coverage, profile, or instrumentation
# flag, which is why notes/test-confidence-map.md maps release confidence to
# behavioral and mutation oracles instead of to a line percentage. Asymmetric on
# purpose: absence is the quiet exit 0, and DISCOVERING a facility (or drifting
# off the recorded toolchain pin, or being unable to run the probe) exits
# nonzero so an upgrade cannot silently start publishing an unreviewed number.
#
# It sits last in the preflight, and is the only member there that asks a real
# `mojo` on PATH anything rather than using the hermetic groups' fake compiler.
# Last is where a nonzero exit reads correctly, because this one indicts the
# toolchain pin rather than the tree, and every gate that does indict the tree
# has already run.
coverage-capability = "python -m scripts.checks.coverage_capability"

# DOGFOOD probes: run three focused executables through the built mtest binary,
# exercising the real discover/build/run/parse/report path. A local smoke handle
# and a reusable helper, NOT a hosted lane of its own: `scripts.harness.dogfood`
# is imported by scripts/build/package_consumption.py, which runs these same
# three probes against the INSTALLED artifact on both gated platforms, so the
# behavioral content already blocks twice per hosted run against a harder target
# than build/mtest.
#
# None of it is independent of mtest: all three assertions parse output mtest
# itself produced, with looser patterns than scripts/harness/selfhost.py applies
# to the same output. The one genuinely independent property, that the files on
# disk match a COMMITTED tuple (which a source-derived inventory cannot notice
# the deletion of), is asserted by scripts/checks/layout.py through this
# module's own `dogfood_test_files`, in the preflight, at no build cost.
[tasks.dogfood-check]
cmd = "python -m scripts.harness.dogfood"
depends-on = ["build-bin"]

# End-to-end gate: build the runnable binary, then drive it against the
# committed known-outcome tree under e2e/ (via e2e/manifest.json, the single
# source of expectations) asserting exact exit codes and structural console
# output. Runs under `pixi run` so the spawned binary inherits the pixi env with
# `mojo` on PATH, which the per-file `mojo build` children need. The harness is
# stdlib-only Python and hard-timeout-guards every subprocess spawn, so a runner
# hang can never wedge CI.
[tasks.e2e]
cmd = "python -m scripts.e2e"
depends-on = ["build-bin"]

# Adversarial cache-protocol gate: drive REAL `build/mtest` processes against
# throwaway projects, concurrently and under the test-only `MTEST_STORE_FAULT`
# publication fault seam, and assert the store's protocol properties from the
# outside. Deliberately NOT part of `harness-check`: that lane is hermetic and
# dependency-free (fake compilers, no `mojo`, no built binary), while every
# scenario here spawns a real per-file `mojo build`, hence the `build-bin` edge
# and its position beside `e2e` in the `ci` chain. It is also the ONLY coverage
# `--no-cache` and `--cache-clear` have that is not reading: their wiring lives
# in private defs of the `src/main.mojo` executable target, which nothing under
# `tests/` can import.
[tasks.cache-protocol-check]
cmd = "python -m scripts.tests.test_cache_protocol"
depends-on = ["build-bin"]

# Layer 2 of the build-artifact cache: stamps the precompile stage of
# `scripts/build/production_build.sh` against its inputs (the script, the exact
# stage command lines, and every file under src/mtest + vendor/mojo-toml), so a
# second `pixi run build` with nothing changed skips `mojo precompile` entirely.
# That skip is the only way two builds can leave `build/mtest.mojoc`
# byte-identical, because `mojo precompile` is not byte-reproducible on this
# toolchain (see production_build.sh). No `depends-on`: every scenario copies
# its own throwaway sandbox and runs the script there, never against this
# checkout's `build/`.
[tasks.build-stamp-check]
cmd = "python -m scripts.tests.test_build_stamp"

# The cheap hosted-CI release barrier. Every non-behavioral member of the local
# floor stays in its exact fail-fast order; GitHub releases the independent
# behavioral and memory-safety lanes only after this aggregate passes.
#
# The three tooling groups are named INDIVIDUALLY rather than through their
# `harness-check` aggregate, because Pixi attributes a failure to the task it
# was running: routing through the aggregate would report all three groups under
# one name to the single job every behavioral matrix cell waits on. Three lines
# buy a self-identifying failure.
#
# `postfork-check` and `build` are listed even though `native-check`,
# `build-profile-check`, `readme-help-check`, and `junit-render-check` already
# pull them in and Pixi runs a shared node once either way. Their positions
# AHEAD of their consumers are the point: this list is the readable statement
# of what the barrier runs and in what order. Pixi errors on a name that does
# not exist, so unlike a comment it cannot rot into fiction.
[tasks.ci-preflight]
depends-on = [
    "version-check",
    "fmt-check",
    "harness-unit-check",
    "repo-policy-check",
    "abi-probe-check",
    "release-tooling-check",
    "safety-check",
    "postfork-check",
    "native-check",
    "junit-check",
    "build",
    "build-profile-check",
    "readme-help-check",
    "junit-render-check",
    "transcripts-check",
    "coverage-capability",
]

# The complete serial source, test, and memory floor. NOT a mirror of hosted CI:
# `package-check`, CodeQL, and `py-check` all run hosted and none is reachable
# from this aggregate. So a green `pixi run ci` is a floor that has been
# cleared, never a prediction of the hosted result. Hosted CI runs the exact
# preflight above, then gives each independent behavioral gate a fresh parallel
# matrix cell. Local agents use focused tasks during iteration; this aggregate
# is for an exhaustive run, hosted failure reproduction, or release rehearsal.
#
# `contract-check-strict` sits last for readability, not freshness: `build-bin`
# is a single shared Pixi task node that `test`, `dogfood-check`, `e2e`, and
# `ci-preflight`'s `readme-help-check` have already run for this invocation, and
# that shared edge is its actual provenance guarantee. Last is just where the
# broadest, slowest gate reads best.
[tasks.ci]
depends-on = [
    "ci-preflight",
    "test",
    "assertions-check",
    "dogfood-check",
    "e2e",
    "cache-protocol-check",
    "build-stamp-check",
    "contract-check-strict",
    "ci-memory",
]

[target.linux-64.dependencies]
valgrind = "==3.27.1"

# On linux-64 the memory aggregate IS the two lanes. Hosted CI gives each its
# own matrix cell and never invokes `pixi run ci`, so this edge is what stops a
# green `pixi run ci` from saying nothing at all about memory safety. It sits
# last in `ci` because it is the broadest and slowest member, and it needs
# nothing from the earlier ones: both lanes compile the suites and the CLI from
# source with `-I src` so every frame is instrumented, and neither reads
# `build/mtest.mojoc` or `build/mtest`. So `pixi run ci-memory` standalone is
# identical to how `ci` reaches it, unlike `contract-check-strict` above.
[target.linux-64.tasks]
ci-memory = { depends-on = ["asan-check", "valgrind-check"] }
